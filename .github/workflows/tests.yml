name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -e ".[dev]"

    - name: Lint with flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 scripts/ recommend.py app.py nl2sparql.py --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 scripts/ recommend.py app.py nl2sparql.py --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

    - name: Format check with black
      run: |
        black --check scripts/ tests/ recommend.py app.py nl2sparql.py --line-length=120 || echo "Format check failed (non-blocking)"

    - name: Type check with mypy
      run: |
        mypy recommend.py app.py nl2sparql.py --ignore-missing-imports || echo "Type check failed (non-blocking)"

    - name: Run tests with pytest
      run: |
        pytest tests/ -v --cov=scripts --cov=recommend --cov-report=xml --cov-report=term-missing

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  ontology-validation:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install rdflib pyshacl

    - name: Validate RDF syntax
      run: |
        python -c "
        import rdflib
        g = rdflib.Graph()
        try:
            g.parse('Clothing_Ontology.ttl', format='turtle')
            print(f'✓ Ontology valid: {len(g)} triples')
        except Exception as e:
            print(f'✗ Ontology parsing failed: {e}')
            exit(1)
        "

    - name: Check ontology structure
      run: |
        python -c "
        import rdflib
        from rdflib import RDF, OWL
        g = rdflib.Graph()
        g.parse('Clothing_Ontology.ttl', format='turtle')
        classes = list(g.subjects(RDF.type, OWL.Class))
        obj_props = list(g.subjects(RDF.type, OWL.ObjectProperty))
        data_props = list(g.subjects(RDF.type, OWL.DatatypeProperty))
        print(f'Classes: {len(classes)}')
        print(f'Object properties: {len(obj_props)}')
        print(f'Datatype properties: {len(data_props)}')
        print('Ontology structure validation passed')
        "

  sparql-queries:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install rdflib pyshacl

    - name: Validate SPARQL query files
      run: |
        python -c "
        import os, glob
        query_files = sorted(glob.glob('queries/*.rq'))
        print(f'Found {len(query_files)} SPARQL query files')
        for qf in query_files:
            with open(qf) as f:
                content = f.read().upper()
            if any(k in content for k in ('SELECT', 'CONSTRUCT', 'ASK', 'DESCRIBE')):
                print(f'OK {os.path.basename(qf)}')
            else:
                print(f'INVALID {os.path.basename(qf)}: unknown query type')
                raise SystemExit(1)
        "

  data-pipeline:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Test mock pipeline
      run: |
        python scripts/run_pipeline.py --llm-mode mock --limit 10
        if [ $? -eq 0 ]; then
          echo "✓ Pipeline test passed"
        else
          echo "✗ Pipeline test failed"
          exit 1
        fi

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install build tools
      run: |
        python -m pip install --upgrade pip setuptools wheel build

    - name: Build distribution
      run: |
        python -m build

    - name: Check distribution files
      run: |
        ls -lh dist/
        if ls dist/clothing_ontology-*.whl >/dev/null 2>&1 && ls dist/clothing_ontology-*.tar.gz >/dev/null 2>&1; then
          echo "Distribution packages built successfully"
        else
          echo "Distribution packages not found"
          exit 1
        fi
