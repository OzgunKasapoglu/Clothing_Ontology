name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.8', '3.9', '3.10', '3.11']

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -e ".[dev]"

    - name: Lint with flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 scripts/ recommend.py app.py --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 scripts/ recommend.py app.py --count --exit-zero --max-complexity=10 --max-line-length=100 --statistics

    - name: Format check with black
      run: |
        black --check scripts/ recommend.py app.py --line-length=100 || echo "Format check failed (non-blocking)"

    - name: Type check with mypy
      run: |
        mypy recommend.py app.py --ignore-missing-imports || echo "Type check failed (non-blocking)"

    - name: Run tests with pytest
      run: |
        pytest tests/ -v --cov=scripts --cov=recommend --cov-report=xml --cov-report=term-missing

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  ontology-validation:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install rdflib pyshacl

    - name: Validate RDF syntax
      run: |
        python -c "
        import rdflib
        g = rdflib.Graph()
        try:
            g.parse('Clothing_Ontology.ttl', format='turtle')
            print(f'✓ Ontology valid: {len(g)} triples')
        except Exception as e:
            print(f'✗ Ontology parsing failed: {e}')
            exit(1)
        "

    - name: Check ontology consistency
      run: |
        python -c "
        import rdflib
        from rdflib import RDFS, RDF
        g = rdflib.Graph()
        g.parse('Clothing_Ontology.ttl', format='turtle')

        # Count key elements
        classes = list(g.subjects(RDF.type, RDFS.Class))
        properties = list(g.subjects(RDF.type, [rdflib.Namespace('http://www.w3.org/1999/02/22-rdf-syntax-ns#')].ObjectProperty))
        print(f'Classes: {len(classes)}')
        print(f'Properties: {len(list(g.predicates()))} unique predicates')
        print('✓ Ontology structure validation passed')
        "

  sparql-queries:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install rdflib pyshacl

    - name: Validate SPARQL query files
      run: |
        import os
        import glob

        query_files = glob.glob('queries/*.rq')
        print(f'Found {len(query_files)} SPARQL query files')

        for qf in sorted(query_files):
            try:
                with open(qf, 'r') as f:
                    content = f.read()
                    if 'SELECT' in content or 'CONSTRUCT' in content or 'ASK' in content or 'DESCRIBE' in content:
                        print(f'✓ {os.path.basename(qf)}: valid SPARQL query')
                    else:
                        print(f'✗ {os.path.basename(qf)}: unknown query type')
                        exit(1)
            except Exception as e:
                print(f'✗ Error reading {qf}: {e}')
                exit(1)

  data-pipeline:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Test mock pipeline
      run: |
        python scripts/run_pipeline.py --llm-mode mock --limit 10
        if [ $? -eq 0 ]; then
          echo "✓ Pipeline test passed"
        else
          echo "✗ Pipeline test failed"
          exit 1
        fi

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install build tools
      run: |
        python -m pip install --upgrade pip setuptools wheel build

    - name: Build distribution
      run: |
        python -m build

    - name: Check distribution files
      run: |
        ls -lh dist/
        if [ -f dist/clothing-ontology-*.whl ] && [ -f dist/clothing-ontology-*.tar.gz ]; then
          echo "✓ Distribution packages built successfully"
        else
          echo "✗ Distribution packages not found"
          exit 1
        fi
